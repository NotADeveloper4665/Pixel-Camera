name: Pixel 9a Fusion Build

on:
  push:
    branches: [main, pixel9a-fusion]
    paths:
      - 'pixel9a-fusion/**'
      - 'morphe-patches/**'
      - 'tools/**'
      - '.github/workflows/build-morphe-patch.yml'
  pull_request:
    paths:
      - 'pixel9a-fusion/**'
      - 'morphe-patches/**'
      - 'tools/**'
      - '.github/workflows/build-morphe-patch.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: pixel9a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test, lint, and build SDK-only capture activity
        run: ./morphe-patches/gradlew -p pixel9a-fusion :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Prepare injection DEX
        run: python3 tools/prepare_fusion_dex.py pixel9a-fusion/app/build/outputs/apk/debug/app-debug.apk build/fusion-dex/Pixel9aFusion.dex
      - uses: actions/upload-artifact@v4
        with:
          name: pixel9a-fusion-debug-apk
          path: pixel9a-fusion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pixel9a-fusion-dex
          path: build/fusion-dex/Pixel9aFusion.dex
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel9a-fusion-test-reports
          path: |
            pixel9a-fusion/app/build/reports/
            pixel9a-fusion/app/build/test-results/

  patches:
    needs: fusion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/download-artifact@v4
        with:
          name: pixel9a-fusion-dex
          path: build/fusion-dex
      - name: Install the generated extension
        run: |
          cp build/fusion-dex/Pixel9aFusion.dex morphe-patches/patches/src/main/resources/Pixel9aFusion.dex
          cp build/fusion-dex/Pixel9aFusion.dex morphe-patches/src/main/resources/Pixel9aFusion.dex
      - name: Verify injection DEX and build Morphe package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./morphe-patches/gradlew -p morphe-patches :patches:test --tests '*Pixel9aFusionDexTest' :patches:buildAndroid --no-daemon
      - name: Verify packaged fusion extension
        run: python3 tools/check_pixel9a_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: pixel9a-morphe-patches
          path: morphe-patches/patches/build/libs/*.mpp
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel9a-patch-test-reports
          path: morphe-patches/patches/build/reports/tests/
